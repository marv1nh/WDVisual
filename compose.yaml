services:
  wardrive-viewer:
    build: ./webapp
    ports:
      - "8080:8080"
    environment:
      KISMET_DATA_DIR: /data
      KISMET_UPLOAD_DIR: /uploads
      WDVISUAL_STATE_DB: /state/wdvisual.sqlite3
      MAX_UPLOAD_MB: 512
    volumes:
      # The recordings remain one directory above the web application.
      - ./:/data:ro
      - kismet_uploads:/uploads
      - wdvisual_state:/state
    restart: unless-stopped

volumes:
  kismet_uploads:
  wdvisual_state:
